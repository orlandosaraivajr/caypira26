{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Orlando Saraiva do Nascimento Júnior">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
    <title>Vagas de Estágio</title>
    <style>
        body { background-color: #f8f9fa; }
        .page-wrapper { max-width: 520px; margin: 3rem auto; padding: 0 1rem; }

        .vaga-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .vaga-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #cfe2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.125rem;
            color: #084298;
        }
        .vaga-title {
            font-size: 0.9375rem;
            font-weight: 500;
            margin: 0 0 2px;
            color: #212529;
        }
        .vaga-sub {
            font-size: 0.75rem;
            color: #6c757d;
            margin: 0;
        }
        .btn-detail {
            font-size: 0.8125rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #b6d4fe;
            background: transparent;
            color: #084298;
            white-space: nowrap;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-detail:hover { background: #cfe2ff; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #adb5bd;
        }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <h1 class="fs-4 fw-semibold mb-1">Listar vagas</h1>
        <p class="text-muted small mb-4">Confira as vagas de estágio cadastradas</p>

        {% if vagas %}
            {% for vaga in vagas %}
                <div class="vaga-card">
                    <div class="d-flex align-items-center gap-3">
                        <div class="vaga-icon">
                            <i class="bi bi-briefcase"></i>
                        </div>
                        <div>
                            <p class="vaga-title">{{ vaga }}</p>
                            <p class="vaga-sub">ID #{{ vaga.pk }}</p>
                        </div>
                    </div>
                    <form action="{% url 'core:read' %}" novalidate method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="id" value="{{ vaga.pk }}">
                        <button type="submit" class="btn-detail">
                            <i class="bi bi-eye"></i> Detalhes
                        </button>
                    </form>
                </div>
            {% endfor %}

        {% else %}
            <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <p class="fw-medium text-muted">Nenhuma vaga cadastrada</p>
            </div>
        {% endif %}

        <div class="mt-3">
            <a href="{% url 'core:index' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Voltar
            </a>
        </div>
    </div>
</body>
</html>
