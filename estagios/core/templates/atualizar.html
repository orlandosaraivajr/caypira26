{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Orlando Saraiva do Nascimento Júnior">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
    <title>Vagas de Estágio</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .page-wrapper {
            max-width: 720px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        .page-header {
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .page-header p {
            color: #6c757d;
            font-size: 0.875rem;
            margin: 0;
        }
        .vaga-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .vaga-icon {
            width: 42px;
            height: 42px;
            background-color: #e7f1ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .vaga-icon i {
            font-size: 1.25rem;
            color: #0d6efd;
        }
        .vaga-title {
            font-size: 0.9375rem;
            font-weight: 500;
            margin: 0;
            color: #212529;
        }
        .vaga-sub {
            font-size: 0.75rem;
            color: #6c757d;
            margin: 2px 0 0;
        }
        .btn-atualizar {
            font-size: 0.8125rem;
            font-weight: 500;
            white-space: nowrap;
            border-radius: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #adb5bd;
        }
        .empty-state i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">

        <div class="page-header">
            <h1>
                Vagas de estágio
                {% if vagas %}
                    <span class="badge bg-primary-subtle text-primary ms-2" style="font-size: 0.75rem; vertical-align: middle;">
                        {{ vagas|length }}
                    </span>
                {% endif %}
            </h1>
            <p>Gerencie e atualize as vagas cadastradas abaixo</p>
        </div>

        {% if vagas %}
            {% for vaga in vagas %}
                <div class="vaga-card">
                    <div class="d-flex align-items-center gap-3">
                        <div class="vaga-icon">
                            <i class="bi bi-briefcase"></i>
                        </div>
                        <div>
                            <p class="vaga-title">{{ vaga }}</p>
                            <p class="vaga-sub">ID #{{ vaga.pk }}</p>
                        </div>
                    </div>
                    <form action="{% url 'core:update' %}" method="POST" novalidate>
                        {% csrf_token %}
                        <input type="hidden" name="id" value="{{ vaga.pk }}">
                        <button type="submit" class="btn btn-outline-primary btn-sm btn-atualizar">
                            <i class="bi bi-pencil me-1"></i> Atualizar
                        </button>
                    </form>
                </div>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <p class="fw-medium text-muted">Nenhuma vaga cadastrada</p>
            </div>
        {% endif %}

        <div class="mt-4">
            <form action="{% url 'core:index' %}" method="GET">
                <button type="submit" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Voltar
                </button>
            </form>
        </div>

    </div>
</body>
</html>
