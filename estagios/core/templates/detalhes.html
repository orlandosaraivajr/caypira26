{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Orlando Saraiva do Nascimento Júnior">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
    <title>Vagas de Estágio</title>
    <style>
        body { background-color: #f8f9fa; }
        .page-wrapper { max-width: 520px; margin: 3rem auto; padding: 0 1rem; }

        .detail-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1.5rem;
        }
        .card-header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 1.25rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid #e9ecef;
        }
        .vaga-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #cfe2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.375rem;
            color: #084298;
        }
        .vaga-name {
            font-size: 1rem;
            font-weight: 500;
            margin: 0 0 2px;
            color: #212529;
        }
        .vaga-id {
            font-size: 0.75rem;
            color: #6c757d;
            margin: 0;
        }
        .field-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f1f3f5;
        }
        .field-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .field-icon {
            font-size: 1rem;
            color: #adb5bd;
            width: 20px;
            flex-shrink: 0;
        }
        .field-label {
            font-size: 0.75rem;
            color: #6c757d;
            width: 80px;
            flex-shrink: 0;
        }
        .field-value {
            font-size: 0.875rem;
            color: #212529;
            font-weight: 500;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #adb5bd;
        }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <h1 class="fs-4 fw-semibold mb-1">Detalhes da vaga</h1>
        <p class="text-muted small mb-4">Informações completas da vaga selecionada</p>

        {% if vaga %}
            <div class="detail-card">
                <div class="card-header-inner">
                    <div class="vaga-avatar">
                        <i class="bi bi-briefcase"></i>
                    </div>
                    <div>
                        <p class="vaga-name">{{ vaga.titulo }}</p>
                        <p class="vaga-id">ID #{{ vaga.pk }}</p>
                    </div>
                </div>

                <div class="field-row">
                    <i class="bi bi-building field-icon"></i>
                    <span class="field-label">Empresa</span>
                    <span class="field-value">{{ vaga.empresa }}</span>
                </div>
                <div class="field-row">
                    <i class="bi bi-telephone field-icon"></i>
                    <span class="field-label">Telefone</span>
                    <span class="field-value">{{ vaga.telefone }}</span>
                </div>
            </div>

        {% else %}
            <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <p class="fw-medium text-muted">Nenhuma vaga cadastrada</p>
            </div>
        {% endif %}

        <div class="mt-3">
            <a href="{% url 'core:read' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Voltar
            </a>
        </div>
    </div>
</body>
</html>
